<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icona di ICDL Quest: astronauta e razzo originali (stessi disegni di js/icons.js), stile neon.
       Versione vettoriale delle PNG create da tools/crea-icone.ps1. -->
  <defs>
    <radialGradient id="alone" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#25255a"/>
      <stop offset="1" stop-color="#12122a"/>
    </radialGradient>
    <!-- la sfocatura e' nelle unita' del gruppo scalato: circa 9px in entrambi i casi -->
    <filter id="neon-astronauta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.700" result="sfocato"/>
      <feMerge><feMergeNode in="sfocato"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-razzo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.600" result="sfocato"/>
      <feMerge><feMergeNode in="sfocato"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#12122a"/>
  <circle cx="256" cy="256" r="200" fill="url(#alone)"/>
  <g>
    <circle cx="150" cy="140" r="4" fill="#ffffff"/>
    <circle cx="402" cy="300" r="3.500" fill="#7fb2ff"/>
    <circle cx="352" cy="392" r="4" fill="#b78cff"/>
    <circle cx="106" cy="236" r="3" fill="#ffffff"/>
  </g>
  <!-- astronauta: griglia 24, scala 12.5, centro (224,280) -->
  <g transform="translate(74 130) scale(12.5)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-astronauta)">
    <rect x="8" y="7.500" width="8" height="5" rx="2.500" fill="#ff4fa3" fill-opacity="0.35" stroke="#ff4fa3" stroke-width="1.120"/>
    <circle cx="12" cy="10" r="7" stroke="#5ef1c9" stroke-width="1.600"/>
    <path d="M6 21c0-3 2.500-5 6-5s6 2 6 5" stroke="#5ef1c9" stroke-width="1.600"/>
    <path d="M9.600 9.200L11 8.700" stroke="#ffffff" stroke-width="0.480"/>
  </g>
  <!-- razzo: griglia 24, scala 5.5, centro (350,170) -->
  <g transform="translate(284 104) scale(5.5)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-razzo)">
    <path d="M10 18l2 4 2-4" stroke="#ffb347" stroke-width="1.820"/>
    <path d="M7 13l-3 4 3 1M17 13l3 4-3 1" stroke="#ff4fa3" stroke-width="1.820"/>
    <path d="M12 2c3 2 5 6 5 10l-2 3H9l-2-3c0-4 2-8 5-10z" stroke="#ff4fa3" stroke-width="1.820"/>
    <circle cx="12" cy="9" r="1.800" stroke="#5ef1c9" stroke-width="1.450"/>
  </g>
</svg>
